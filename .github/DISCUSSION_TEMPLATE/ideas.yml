title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are for feature concepts and product direction. If something is already broken, open a bug issue instead.
  - type: input
    id: idea
    attributes:
      label: Idea
      description: Say the idea in one sentence.
      placeholder: "Add a checkpoint comparison view that replays the same prompt over time"
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: Who is this for?
      description: Describe the user and workflow.
      placeholder: "As someone fine-tuning a chat model, I want to..."
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What should it feel like?
      description: Describe controls, screens, outputs, or examples.
  - type: dropdown
    id: complexity
    attributes:
      label: Rough size
      options:
        - Small polish
        - Medium feature
        - Large project
        - Research/unknown
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs or risks
      description: What could make this confusing, slow, unsafe, or hard to maintain?
