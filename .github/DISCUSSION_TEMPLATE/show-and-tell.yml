title: "[Model Gallery] "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        Share what you trained, what data you used, what worked, what failed, and the weird little wins.
  - type: input
    id: project
    attributes:
      label: What did you build?
      placeholder: "A tiny chat model that writes public-domain-style sea poems"
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      description: Model size, dataset, tokenizer, training/fine-tuning settings, and rough runtime.
      placeholder: |
        Model:
        Data:
        Steps:
        LoRA/full fine-tune:
        Runtime:
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Share samples, screenshots, observations, or lessons learned.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: What would you try next?
      placeholder: "More data mixing, lower learning rate, longer context, better eval prompts..."
