<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LabLLM hero artwork</title>
  <desc id="desc">A cozy futuristic macOS app window showing a local language model lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dff1ff"/>
      <stop offset="0.52" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#fff2dc"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="86" x2="1160" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f6fbff" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="70" y="40" width="1140" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#3c5b77" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <g opacity="0.52" filter="url(#soft)">
    <circle cx="170" cy="110" r="64" fill="#7cc7ff"/>
    <circle cx="1030" cy="430" r="82" fill="#ffd27c"/>
    <circle cx="1120" cy="130" r="58" fill="#9ee6d2"/>
  </g>
  <g opacity="0.38" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#47708e">
    <text x="56" y="72">attention context token gradient learn predict sample loss val_loss checkpoint</text>
    <text x="740" y="82">local first mlx swiftui tiny gpt tokenizer corpus train</text>
    <text x="86" y="466">prompt -&gt; tokens -&gt; model -&gt; sample -&gt; checkpoint -&gt; try again, but with snacks</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="72" width="1040" height="380" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-width="2"/>
    <rect x="120" y="72" width="1040" height="42" rx="28" fill="#edf6ff"/>
    <circle cx="150" cy="93" r="7" fill="#ff6b6b"/>
    <circle cx="174" cy="93" r="7" fill="#ffd166"/>
    <circle cx="198" cy="93" r="7" fill="#4ecdc4"/>
    <text x="230" y="99" font-family="SFMono-Regular, Menlo, monospace" font-size="14" fill="#60809a">LabLLM.app/local-brain-not-included</text>
    <rect x="142" y="136" width="210" height="290" rx="16" fill="#f5fbff" stroke="#d7e8f5"/>
    <text x="162" y="164" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#2272d6">LABLLM</text>
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      <rect x="156" y="190" width="168" height="30" rx="10" fill="#2f7df6"/>
      <text x="176" y="210" fill="#ffffff">Model Builder</text>
      <text x="176" y="250" fill="#4b6478">Pre-Training Data</text>
      <text x="176" y="286" fill="#4b6478">Fine-tuning Data</text>
      <text x="176" y="322" fill="#4b6478">Training</text>
      <text x="176" y="358" fill="#4b6478">Sampling</text>
      <text x="176" y="394" fill="#4b6478">Models</text>
    </g>
    <rect x="386" y="136" width="730" height="290" rx="18" fill="#ffffff" stroke="#d8e8f4"/>
    <text x="420" y="178" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#1f2d3a">Build a small model on your Mac</text>
    <text x="422" y="208" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#5c6f80">Design, train, fine-tune, sample, inspect, quantize, and serve locally.</text>
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="420" y="244" width="188" height="76" rx="14" fill="#edf6ff" stroke="#d4e8ff"/>
      <text x="442" y="272" fill="#2369bd">loss</text>
      <polyline points="442,300 470,292 498,284 526,278 554,267 582,260" stroke="#2f7df6" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="632" y="244" width="188" height="76" rx="14" fill="#fff7e8" stroke="#ffe0a3"/>
      <text x="654" y="272" fill="#ad6b10">val_loss</text>
      <polyline points="654,300 682,294 710,286 738,288 766,296 794,302" stroke="#f39c12" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="844" y="244" width="188" height="76" rx="14" fill="#eefaf7" stroke="#cbece2"/>
      <text x="866" y="272" fill="#16705b">sample</text>
      <text x="866" y="300" fill="#34495e">the tiny model</text>
    </g>
    <g>
      <rect x="420" y="350" width="614" height="18" rx="9" fill="#edf1f5"/>
      <rect x="420" y="350" width="386" height="18" rx="9" fill="#2f7df6"/>
      <text x="1048" y="365" font-family="SFMono-Regular, Menlo, monospace" font-size="13" fill="#547087">63%</text>
      <text x="420" y="396" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#4f6578">Training locally. No cloud account. No subscription. No mysterious dashboard tax.</text>
    </g>
  </g>
</svg>
