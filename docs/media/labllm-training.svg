<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LabLLM training dashboard mock screenshot</title>
  <desc id="desc">A mock screenshot of the training dashboard with blue training loss and orange validation loss.</desc>
  <rect width="960" height="540" rx="28" fill="#f3f9ff"/>
  <rect x="36" y="34" width="888" height="472" rx="24" fill="#ffffff" stroke="#d9e8f4"/>
  <text x="72" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#203040">Training</text>
  <text x="72" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#617486">Loss goes down. Validation loss keeps it honest. Overfitting gets fewer hiding places.</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="72" y="148" width="164" height="78" rx="14" fill="#eef6ff"/>
    <text x="92" y="177" font-size="13" fill="#58708a">Progress</text>
    <text x="92" y="204" font-size="28" font-weight="800" fill="#2f7df6">64%</text>
    <rect x="256" y="148" width="164" height="78" rx="14" fill="#f7fbff"/>
    <text x="276" y="177" font-size="13" fill="#58708a">Train loss</text>
    <text x="276" y="204" font-size="28" font-weight="800" fill="#2f7df6">2.18</text>
    <rect x="440" y="148" width="164" height="78" rx="14" fill="#fff8ec"/>
    <text x="460" y="177" font-size="13" fill="#8a6a35">Val loss</text>
    <text x="460" y="204" font-size="28" font-weight="800" fill="#f39c12">2.43</text>
    <rect x="624" y="148" width="220" height="78" rx="14" fill="#effaf6"/>
    <text x="644" y="177" font-size="13" fill="#4d796b">Tokens / sec</text>
    <text x="644" y="204" font-size="28" font-weight="800" fill="#19a47a">18,240</text>
  </g>
  <rect x="72" y="260" width="600" height="190" rx="18" fill="#fbfdff" stroke="#dceaf5"/>
  <g stroke="#e4eef7" stroke-width="1">
    <line x1="108" y1="300" x2="640" y2="300"/>
    <line x1="108" y1="340" x2="640" y2="340"/>
    <line x1="108" y1="380" x2="640" y2="380"/>
    <line x1="108" y1="420" x2="640" y2="420"/>
  </g>
  <polyline points="108,420 155,396 202,372 249,350 296,334 343,318 390,304 437,294 484,286 531,278 578,271 625,266" fill="none" stroke="#2f7df6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="108,432 155,402 202,374 249,354 296,342 343,338 390,342 437,351 484,365 531,381 578,400 625,421" fill="none" stroke="#f39c12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
    <circle cx="724" cy="296" r="6" fill="#2f7df6"/>
    <text x="742" y="301" fill="#52677a">Training loss</text>
    <circle cx="724" cy="326" r="6" fill="#f39c12"/>
    <text x="742" y="331" fill="#52677a">Validation loss</text>
  </g>
  <rect x="708" y="362" width="164" height="88" rx="16" fill="#f8fbff" stroke="#dceaf5"/>
  <text x="728" y="390" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#617486">Live sample</text>
  <text x="728" y="420" font-family="SFMono-Regular, Menlo, monospace" font-size="13" fill="#2f7df6">Once upon a token...</text>
</svg>
